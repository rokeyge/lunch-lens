name: Update district menu

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess the current image even when its hash is unchanged
        type: boolean
        default: false
      program:
        description: Optional program ID to process (blank processes all programs)
        type: string
        default: ""
      model:
        description: Optional primary Gemini model override
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: menu-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore menu checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .menu-state
          key: menu-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: menu-state-v1-${{ github.ref_name }}-
      - name: Discover, extract, and verify menu
        id: pipeline
        env:
          LUNCH_KEY: ${{ secrets.LUNCH_KEY }}
          GEMINI_API_KEY: ${{ secrets.LUNCH_KEY }}
          GEMINI_MODEL: ${{ inputs.model || '' }}
          FORCE_MENU_UPDATE: ${{ inputs.force && 'true' || 'false' }}
          TARGET_PROGRAM: ${{ inputs.program || '' }}
        run: |
          if [ -n "$TARGET_PROGRAM" ]; then
            npm run menu:update -- "$TARGET_PROGRAM"
          else
            npm run menu:update
          fi

      - name: Report failure via GitHub issue
        if: failure() && steps.pipeline.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="District menu update failure"
          EXISTING_ISSUE=$(gh issue list --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Menu update failed: $RUN_URL. Download menu-diagnostics from this run for source images and model responses. Results: $(jq -c . menu-diagnostics/results.json)"
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue edit "$EXISTING_ISSUE" --body "$BODY"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label "bug"
          fi

      - name: Check for a published update
        if: always()
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/data/current.json src/data/menus public/menu-sources)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified menu
        id: commit
        if: always() && !cancelled() && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/current.json src/data/menus public/menu-sources
          git commit -m "Update district lunch menus"
          git push

      - name: Close resolved failure issue
        if: success() && inputs.program == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="District menu update failure"
          EXISTING_ISSUE=$(gh issue list --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue close "$EXISTING_ISSUE" --comment "Resolved: Full menu batch succeeded in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi

      - name: Save menu checkpoints
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .menu-state
          key: menu-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-diagnostics
          include-hidden-files: true
          path: |
            menu-diagnostics/
            .menu-state/
          retention-days: 30
