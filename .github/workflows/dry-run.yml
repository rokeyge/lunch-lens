name: Dry Run Gemini Comparison

on:
  workflow_dispatch:
    inputs:
      program:
        description: "Program ID to compare"
        required: true
        default: "elementary-standard"
        type: choice
        options:
          - elementary-standard
          - elementary-bayside
          - middle-district
          - middle-special-6-8
          - preschool

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Gemini Dry-Run Comparison
        env:
          LUNCH_KEY: ${{ secrets.LUNCH_KEY }}
        run: node scripts/compare-gemini.mjs ${{ inputs.program }}
